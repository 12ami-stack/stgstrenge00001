<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>サイボーグ兵器襲来STG</title>
    <style>
        body {
            margin: 0;
            background: #111;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
            justify-content: center;
            align-items: center;
        }
        #game-container {
            display: flex;
            border: 2px solid #555;
            background: #000;
        }
        #canvas-box {
            position: relative;
            width: 400px;
            height: 600px;
        }
        canvas {
            background: #050515;
            display: block;
        }
        #sidebar {
            width: 280px;
            background: #112211; /* 軍用モニター風のダークグリーン */
            border-left: 2px solid #555;
            display: flex;
            flex-direction: column;
            padding: 15px;
            box-sizing: border-box;
        }
        h2 {
            font-size: 16px;
            margin-top: 0;
            border-bottom: 1px solid #444;
            padding-bottom: 8px;
            color: #33ff33; /* グリーンベレー・SFモニターカラー */
        }
        #dialogue-area {
            flex: 1;
            background: #051005;
            border: 1px solid #225522;
            padding: 10px;
            overflow-y: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }
        .log-item {
            margin-bottom: 8px;
            border-left: 3px solid #33ff33;
            padding-left: 8px;
            animation: fadeIn 0.2s ease-out;
            font-size: 13px;
            line-height: 1.4;
        }
        .log-time {
            font-size: 10px;
            color: #66aa66;
            margin-bottom: 2px;
        }
        #info {
            margin-top: 10px;
            font-size: 11px;
            color: #aaa;
            line-height: 1.5;
            border-top: 1px solid #225522;
            padding-top: 8px;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="canvas-box">
        <canvas id="gameCanvas" width="400" height="600"></canvas>
    </div>
    <div id="sidebar">
        <h2>戦術データ・敵軍通信</h2>
        <div id="dialogue-area"></div>
        <div id="info">
            [操作]<br>
            矢印キー: 移動 / スペースキー: ショット<br><br>
            ※ブラウザ制限により音声は順次再生されます。
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const dialogueArea = document.getElementById('dialogue-area');

let player = { x: 200, y: 500, size: 20, speed: 5, color: '#00ffcc' };
let keys = {};
let bullets = [];
let enemies = [];
let score = 0;
let MAX_LOGS = 6;

window.addEventListener('keydown', e => { keys[e.code] = true; });
window.addEventListener('keyup', e => { keys[e.code] = false; });

let shootTimer = 0;
function handlePlayerInput() {
    if (keys['ArrowLeft'] && player.x > player.size) player.x -= player.speed;
    if (keys['ArrowRight'] && player.x < canvas.width - player.size) player.x += player.speed;
    if (keys['ArrowUp'] && player.y > player.size) player.y -= player.speed;
    if (keys['ArrowDown'] && player.y < canvas.height - player.size) player.y += player.speed;

    shootTimer++;
    if (keys['Space'] && shootTimer % 8 === 0) {
        bullets.push({ x: player.x, y: player.y - 10, width: 4, height: 12, speed: 9 });
    }
}

function getBestCommonVoice() {
    if (!('speechSynthesis' in window)) return null;
    const voices = window.speechSynthesis.getVoices();
    const targetNames = ['haruka', 'ichiro', 'kyoko', 'sayaka']; 
    for (let name of targetNames) {
        const found = voices.find(v => v.lang.includes('ja') && v.name.toLowerCase().includes(name));
        if (found) return found;
    }
    const googleVoice = voices.find(v => v.lang.includes('ja') && v.name.includes('Google'));
    if (googleVoice) return googleVoice;

    return voices.find(v => v.lang.includes('ja')) || null;
}

function speakAndLog(text) {
    const div = document.createElement('div');
    div.className = 'log-item';
    div.innerHTML = `<div class="log-time">HOSTILE UNIT</div>${text}`;
    dialogueArea.appendChild(div);

    while (dialogueArea.children.length > MAX_LOGS) {
        dialogueArea.removeChild(dialogueArea.firstChild);
    }

    if ('speechSynthesis' in window) {
        // 音声を完全に消さず、重なって再生できるようにキャンセル処理を挟まずに独立して speak() を呼び出す
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ja-JP';
        utterance.pitch = 0.55; // さらに低くして機械的なボイスに
        utterance.rate = 1.2;   // 冷徹に淡々と喋るテンポ

        const selectedVoice = getBestCommonVoice();
        if (selectedVoice) {
            utterance.voice = selectedVoice;
        }

        window.speechSynthesis.speak(utterance);
    }
}

// ★すべてのセリフを新パターン（SF・冷徹なサイボーグ機動兵器風）に一新
const dialogueList = {
    appear: [
        "「ターゲットを確認。これより排除行動を開始する」", 
        "「防衛線を突破する。不確定要素はすべて壊滅させる」"
    ],
    damaged: [
        "「外部装甲に損傷。戦闘継続に問題なし」", 
        "「シールド低下。敵の攻撃パターンを解析中」", 
        "「被弾を確認。反撃フェーズへ移行する」",
        "K「小規模なダメージ。エネルギー出力を上昇」"
    ],
    halfHp: [
        "「警告、機体損耗率が規定値を突破。リミッターを解除する」", 
        "「手強い個体と判断。全力作戦を実行に移す」"
    ],
    defeated: [
        "「システムダウン。全機能を停止する…」", 
        "「大破、離脱する。データは本国へ転送した…」"
    ]
};

function getRandomDialogue(type) {
    const arr = dialogueList[type];
    return arr[Math.floor(Math.random() * arr.length)];
}

let spawnTimer = 0;
function spawnEnemies() {
    spawnTimer++;
    if (spawnTimer % 120 === 0 && enemies.length < 3) {
        enemies.push({
            x: Math.random() * 320 + 40,
            y: -30,
            size: 22,
            speed: 1.2,
            hp: 8,
            maxHp: 8,
            color: '#33ff33', // 敵をサイバーな緑色に変更
            hasSpokenAppear: false,
            hasSpokenHalf: false,
            voiceCooldown: 0
        });
    }
}

function update() {
    handlePlayerInput();
    spawnEnemies();

    for (let i = bullets.length - 1; i >= 0; i--) {
        bullets[i].y -= bullets[i].speed;
        if (bullets[i].y < 0) {
            bullets.splice(i, 1);
            continue;
        }

        for (let j = enemies.length - 1; j >= 0; j--) {
            let e = enemies[j];
            let dist = Math.hypot(bullets[i].x - e.x, bullets[i].y - e.y);
            
            if (dist < e.size + bullets[i].width) {
                e.hp--;
                bullets.splice(i, 1);

                if (e.hp <= 0) {
                    speakAndLog(getRandomDialogue('defeated'));
                    enemies.splice(j, 1);
                    score += 100;
                } 
                else if (e.hp <= e.maxHp / 2 && !e.hasSpokenHalf && e.voiceCooldown === 0) {
                    e.hasSpokenHalf = true;
                    e.voiceCooldown = 90; 
                    speakAndLog(getRandomDialogue('halfHp'));
                } 
                else if (e.voiceCooldown === 0) {
                    e.voiceCooldown = 130; 
                    speakAndLog(getRandomDialogue('damaged'));
                }
                break;
            }
        }
    }

    for (let i = enemies.length - 1; i >= 0; i--) {
        let e = enemies[i];
        e.y += e.speed;
        
        if (e.voiceCooldown > 0) e.voiceCooldown--;

        if (!e.hasSpokenAppear && e.y > 40) {
            e.hasSpokenAppear = true;
            e.voiceCooldown = 90; 
            speakAndLog(getRandomDialogue('appear'));
        }

        if (e.y > canvas.height + 50) {
            enemies.splice(i, 1);
        }
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = 'rgba(51,255,51,0.05)'; // 緑の星屑
    for(let i=0; i<5; i++) {
        ctx.fillRect(Math.random() * canvas.width, Math.random() * canvas.height, 2, 2);
    }

    ctx.fillStyle = player.color;
    ctx.beginPath();
    ctx.moveTo(player.x, player.y - player.size);
    ctx.lineTo(player.x - player.size, player.y + player.size);
    ctx.lineTo(player.x + player.size, player.y + player.size);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#00ffff';
    bullets.forEach(b => ctx.fillRect(b.x - b.width/2, b.y, b.width, b.height));

    enemies.forEach(e => {
        ctx.fillStyle = e.color;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.size, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#222';
        ctx.fillRect(e.x - 18, e.y - 30, 36, 5);
        ctx.fillStyle = '#33ff33'; 
        ctx.fillRect(e.x - 18, e.y - 30, 36 * (e.hp / e.maxHp), 5);
    });

    ctx.fillStyle = '#fff';
    ctx.font = '16px sans-serif';
    ctx.fillText(`SCORE: ${score}`, 15, 30);
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

if ('speechSynthesis' in window) {
    window.speechSynthesis.onvoiceschanged = () => {
        getBestCommonVoice();
    };
}

loop();
</script>

</body>
</html>
